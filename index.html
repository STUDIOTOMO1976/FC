/* Original 4-panel manga: exact lossless image data, no illustration changes */
.manga{padding:clamp(65px,9vw,150px) 0;background:#fff9ed;color:#3f2516;overflow:hidden;scroll-margin-top:90px}

.manga-open-label{position:absolute;bottom:12px;right:12px;border:1px solid #744523;border-radius:100px;background:#fff9f4e8;color:#402c21;font-weight:900;font-size:12px;padding:10px 14px;backdrop-filter:blur(7px)}

/* AGEPAN pop-and-land sequence: every hero bread arrives separately. */
.header{display:none!important}
.hero-char .floaty{animation-name:breadHopIn!important;animation-duration:940ms!important;animation-timing-function:cubic-bezier(.2,.8,.19,1)!important;animation-fill-mode:both!important;animation-iteration-count:1!important;animation-direction:normal!important;animation-delay:calc(140ms + var(--ind)*155ms)!important}
@keyframes breadHopIn{0%{opacity:0;transform:translate3d(0,180px,0) rotate(-10deg) scale(.62)}52%{opacity:1;transform:translate3d(0,-40px,0) rotate(4deg) scale(1.07)}74%{transform:translate3d(0,14px,0) rotate(-2deg) scale(.96)}90%{transform:translate3d(0,-8px,0) rotate(1deg) scale(1.018)}100%{opacity:1;transform:translate3d(0,0,0) rotate(0) scale(1)}}
.hero-char.hop-on-tap .floaty{animation:breadSingleHop 620ms cubic-bezier(.21,.7,.17,1) both!important}
